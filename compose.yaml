name: tairan-portfolio
services:
  database:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  directus:
    image: directus/directus:11.17.4
    ports:
      - "127.0.0.1:8055:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      PUBLIC_URL: ${NUXT_PUBLIC_CMS_URL:-http://localhost:8055}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: portfolio
      DB_USER: portfolio
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      CACHE_ENABLED: "false"
      ASSETS_CACHE_TTL: "0"
      FILES_MAX_UPLOAD_SIZE: 20mb
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: "100"
      RATE_LIMITER_DURATION: "1"
      TELEMETRY: "false"
    volumes:
      - uploads:/directus/uploads
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_CONTENT_MODE: directus
      NUXT_DIRECTUS_URL: http://directus:8055
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_PUBLIC_CMS_URL: ${NUXT_PUBLIC_CMS_URL:-http://localhost:8055}
    depends_on:
      - directus
    restart: unless-stopped

  proxy:
    image: nginx:1.28.0-alpine
    profiles: [production]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - directus
    restart: unless-stopped

  backup:
    image: postgres:17.6-alpine
    profiles: [backup]
    environment:
      PGHOST: database
      PGUSER: portfolio
      PGDATABASE: portfolio
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - uploads:/uploads:ro
      - ./deploy/backups:/backups
    entrypoint: /bin/sh

  restore:
    image: postgres:17.6-alpine
    profiles: [restore]
    environment:
      PGHOST: database
      PGUSER: portfolio
      PGDATABASE: portfolio
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - uploads:/uploads
      - ./deploy/backups:/backups:ro
    entrypoint: /bin/sh

volumes:
  postgres_data:
  uploads:
